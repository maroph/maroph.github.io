# 12-SEP-2026
# Zensical Documentation:
# https://zensical.org/docs/
# Zensical >= 0.0.58
[project]
dev_addr = "localhost:8000"

site_name = "My Main GitHub Page"
site_description = "My main GitHub Page"
site_author = "Manfred Rosenboom (maroph)"
site_url = "https://maroph.github.io/"

docs_dir = "docs"
site_dir = "site"
use_directory_urls = false

repo_url = "https://github.com/maroph/maroph.github.io"
repo_name = "maroph/maroph.github.io"
edit_uri = "edit/main/docs/"

copyright = """
Copyright &copy 2020-2026 <a href="https://creativecommons.org/licenses/by/4.0/">CC-BY 4.0</a> by <a href="https://maroph.github.io/">Manfred Rosenboom</a><br/>
<a href="#__consent">Change cookie settings</a>
"""

nav = [
  { "Home" = "index.md" },
  { "Links" = [
    { "Links" = "links/index.md" },
    { "My Sites" = "links/my_sites.md" },
    { "GitHub Pages" = "links/github_pages.md" },
    { "Collaboration" = "links/collaboration.md" },
    { "GPT" = "links/gpt.md" },
    { "Rankings" = "links/rankings.md" },
    { "Security" = "links/security.md" },
    { "Software" = "links/software.md" }
  ]},
  { "Info" = [
    { "Info" = "info/index.md" },
    { "About" = "info/about.md" },
    { "OpenPGP Key" = "info/openpgp/openpgp.md" },
    { "GDPR/DSGVO" = "info/gdpr.md" },
    { "License" = "info/license.md" },
    { "Sources" = "info/sources.md" }
  ]}
]

extra_css = ["assets/extra/css/extra.css"]

# https://zensical.org/docs/setup/validation/
[project.validation]
invalid_links = true
invalid_link_anchors = true
# unresolved_references: 0.0.56: deprecated, will be remove in a future release
unresolved_references = false
# unresolved_footnotes = false
# unused_definitions = false
# unused_footnotes = false
# shadowed_definitions = false
# shadowed_footnotes = false

[project.theme]
favicon = "assets/great_wave_off_kanagawa_32x32.png"
logo = "assets/great_wave_off_kanagawa_100x100.png"
language = "en"
direction = "ltr"
features = [
    "announce.dismiss",
    "content.action.edit",
    "content.action.view",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "header.autohide",
    "navigation.expand",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.prune",
    "navigation.sections",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "toc.follow"
]

palette = [
  {
    scheme = "default",
    toggle = {
      icon = "lucide/sun",
      name = "Switch to dark mode"
    }
  },
  {
    scheme = "slate",
    toggle = {
      icon = "lucide/moon",
      name = "Switch to light mode"
    }
  }
]


[project.theme.font]
font = false


[project.theme.icon]
# logo = "lucide/smile"
repo = "fontawesome/brands/github"
edit = "material/pencil"
view = "material/eye"
previous = "fontawesome/solid/angle-left"
next = "fontawesome/solid/angle-right"


[project.markdown_extensions.attr_list]

[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji" 
emoji_generator = "zensical.extensions.emoji.to_svg"

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = "true"
line_spans = "__span"
pygments_lang_class = "true"

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.snippets]

[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.tables]


# https://zensical.org/docs/setup/extensions/macros/
# [project.markdown_extensions.zensical.extensions.macros]
# https://zensical.org/docs/compatibility/mkdocs/plugins/#macros
[project.plugins.macros]
include_yaml = ["docs/assets/variables.yml"]
on_undefined = "strict"
on_error_fail = true

# https://zensical.org/docs/compatibility/mkdocs/plugins/#minify
[project.plugins.minify]
minify_html = true

[project.plugins.offline]
enabled = false


[project.extra]
generator = true

social = [
    {
        icon = "fontawesome/brands/codepen",
        link = "https://codepen.io/maroph/",
        name = "codepen.io/maroph"
    },
    {
        icon = "fontawesome/brands/github",
        link = "https://github.com/maroph",
        name = "github.com/maroph"
    },
    {
        icon = "fontawesome/brands/mastodon",
        link = "https://mastodon.social/@maroph",
        name = "mastodon.social/@maroph"
    }
]

[project.extra.consent]
title = "Cookie consent"
description = """
    We use cookies to recognize your repeated visits and preferences, as well
    as to measure the effectiveness of our documentation and whether users
    find what they're searching for. With your consent, you're helping us to
    make our documentation better.
"""
actions = [
    "accept",
    "reject",
    "manage"
]
