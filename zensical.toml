# 21-NOV-2026
# Zensical >= 0.1.3
# ---
# Based on
# https://github.com/maroph/zensical_sample/blob/main/zensical.toml
[project]
dev_addr = "localhost:8000"

site_name = "My Main GitHub Page"
site_author = "Manfred Rosenboom (maroph)"
site_url = "https://maroph.github.io/"
site_description = """
My main GitHub Page
"""

repo_url = "https://github.com/maroph/maroph.github.io"
repo_name = "maroph/maroph.github.io"
edit_uri = "edit/main/docs/"

docs_dir = "docs"
site_dir = "site"
use_directory_urls = false

exclude_docs = """
!.nojekyll
!.well-known
"""

copyright = """
Copyright &copy 2020-2026 <a href="https://creativecommons.org/licenses/by/4.0/">CC-BY 4.0</a> by <a href="https://maroph.github.io/">Manfred Rosenboom</a><br/>
<a href="#__consent">Change cookie settings</a>
"""

nav = [
  { "Home" = "index.md" },
  { "Links" = [
    { "Links" = "links/index.md" },
    { "My Sites" = "links/my_sites.md" },
    { "GitHub Pages" = "links/github_pages.md" },
    { "Collaboration" = "links/collaboration.md" },
    { "GPT" = "links/gpt.md" },
    { "Rankings" = "links/rankings.md" },
    { "Security" = "links/security.md" },
    { "Software" = "links/software.md" }
  ]},
  { "Info" = [
    { "Info" = "info/index.md" },
    { "About" = "info/about.md" },
    { "OpenPGP Key" = "info/openpgp/openpgp.md" },
    { "GDPR/DSGVO" = "info/gdpr.md" },
    { "License" = "info/license.md" },
    { "Sources" = "info/sources.md" }
  ]}
]

extra_css = ["assets/extra/css/extra.css"]

[project.validation]
invalid_links = true
invalid_link_anchors = true
unresolved_references = false
unresolved_footnotes = false
unused_definitions = false
unused_footnotes = false
shadowed_definitions = false
shadowed_footnotes = false

[project.theme]
font = false
favicon = "assets/great_wave_off_kanagawa_circle_64x64.png"
logo = "assets/great_wave_off_kanagawa_circle_251x251.png"
language = "en"
direction = "ltr"
features = [
    # "announce.dismiss",
    # "content.action.edit",
    # "content.action.view",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "header.autohide",
    "navigation.expand",
    # "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.prune",
    "navigation.sections",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "toc.follow"
]

palette = [
    {
        scheme = "default",
        media = "(prefers-color-scheme: light)",
        toggle = {
            icon = "lucide/sun",
            name = "Switch to dark mode"
          }
    },
    {
        scheme = "slate",
        media = "(prefers-color-scheme: dark)",
        toggle = {
            icon = "lucide/moon",
            name = "Switch to light mode"
          }
    }
]


[project.theme.icon]
repo = "fontawesome/brands/github"
edit = "material/pencil"
view = "material/eye"
previous = "fontawesome/solid/angle-left"
next = "fontawesome/solid/angle-right"


[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# pymdownx.snippets.base_path = "includes"
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}


[project.plugins.git-revision-date-localized]
enabled = true
type = "iso_datetime"
timezone = "Europe/Amsterdam"
enable_creation_date = false
fallback_to_build_date = true

[project.plugins.meta]
enabled = true

[project.plugins.minify]
enabled = true
minify_html = true
minify_js = false
minify_css = false
htmlmin_opts = {
    remove_comments = true
}

[project.plugins.privacy]
enabled = true

[project.plugins.search]
enabled = false


[project.extra]
generator = true

social = [
    {
        icon = "fontawesome/brands/codepen",
        link = "https://codepen.io/maroph/",
        name = "codepen.io/maroph"
    },
    {
        icon = "fontawesome/brands/github",
        link = "https://github.com/maroph",
        name = "github.com/maroph"
    },
    {
        icon = "fontawesome/brands/mastodon",
        link = "https://mastodon.social/@maroph",
        name = "mastodon.social/@maroph"
    }
]

[project.extra.consent]
title = "Cookie consent"
description = """
    We use cookies to recognize your repeated visits and preferences, as well
    as to measure the effectiveness of our documentation and whether users
    find what they're searching for. With your consent, you're helping us to
    make our documentation better.
"""
actions = [
    "accept",
    "reject",
    "manage"
]
